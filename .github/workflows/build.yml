name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: QuickMark-Windows
          path: |
            dist/*.exe
            dist/*.zip
      - name: Publish to the Releases page
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest dist/*.exe dist/*.zip --title "Quick Mark for Windows" --notes "QuickMark-Windows.zip: unzip anywhere and run Quick Mark.exe. QuickMark-Portable runs without installing."
