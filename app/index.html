$('#titleIn').addEventListener('input', e=>{ if(S.board){ S.board.title=e.target.value; saveSoon(); } });
$('#titleIn').addEventListener('keydown', e=>{ if(e.key==='Enter') e.target.blur(); });
$('#undoBtn').onclick=undo; $('#redoBtn').onclick=redo;

function fmtDate(t){ if(!t) return ''; const d=new Date(t), now=new Date(); const same=d.toDateString()===now.toDateString(); return same? 'Today '+d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}) : d.toLocaleDateString([], {month:'short',day:'numeric',year: d.getFullYear()===now.getFullYear()?undefined:'numeric'}); }
let libBoards=[], confirmId=null, folders=[], curFolder='', unsubFolders=null;
const FOLDER_SVG='<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>';
const folderById = id => folders.find(f=>f.id===id);
const parentOf = id => { const f=folderById(id); return f && f.parent && folderById(f.parent) ? f.parent : ''; };
const boardFolder = b => b.folder && folderById(b.folder) ? b.folder : '';   // boards whose folder is gone show at the top level
function pathTo(id){ const out=[]; let g=0; while(id && g++<50){ const f=folderById(id); if(!f) break; out.unshift(f); id=parentOf(f.id); } return out; }
function descendants(id){ const out=new Set([id]); let grew=true; while(grew){ grew=false; for(const f of folders) if(!out.has(f.id) && out.has(parentOf(f.id))){ out.add(f.id); grew=true; } } return out; }
const byName = (a,b) => (a.name||'').localeCompare(b.name||'', undefined, {numeric:true, sensitivity:'base'});
function countIn(id){ const sub=descendants(id); return {boards: libBoards.filter(b=>sub.has(boardFolder(b))).length, folders: sub.size-1}; }
function renderLib(){
  const g=$('#grid'), e=$('#libEmpty');
  if(curFolder && !folderById(curFolder) && S.mode!=='connecting' && foldersLoaded){ curFolder=''; }
  const path=pathTo(curFolder);
  $('#crumbs').innerHTML = `<button data-go="">All boards</button>` + path.map((f,i)=>`<span class="slash">/</span>`+(i===path.length-1?`<span class="here">${esc(f.name||'Untitled folder')}</span>`:`<button data-go="${f.id}">${esc(f.name||'Untitled folder')}</button>`)).join('');
  if(!path.length) $('#crumbs').innerHTML='<span class="here">All boards</span>';
  const subs=folders.filter(f=>parentOf(f.id)===curFolder).sort(byName);
  const boards=libBoards.filter(b=>boardFolder(b)===curFolder);
  const folderHtml=subs.map(f=>{ const c=countIn(f.id); return `<div class="card folder" data-folder="${f.id}" tabindex="0" role="link" aria-label="Open folder ${esc(f.name||'Untitled folder')}">
      <div class="thumb"><svg viewBox="0 0 24 24">${FOLDER_SVG}</svg></div>
      <div class="meta"><div><div class="t">${esc(f.name||'Untitled folder')}</div><div class="d">${c.boards} board${c.boards===1?'':'s'}${c.folders?` · ${c.folders} folder${c.folders===1?'':'s'}`:''}</div></div>
      <button class="btn ghost icon" data-fmenu="${f.id}" title="Rename, move or delete" aria-label="Folder options"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button></div>
      ${confirmId==='f:'+f.id?`<div class="confirm" style="flex-wrap:wrap"><div class="d" style="width:100%;margin-bottom:6px">Anything inside moves up one level.</div><button class="btn" data-cancel="1">Keep</button><button class="btn primary" style="background:var(--danger);border-color:var(--danger)" data-freally="${f.id}">Delete folder</button></div>`:''}
    </div>`; }).join('');
  g.innerHTML=folderHtml + boards.map(b=>`<div class="card" draggable="true" data-open="${b.id}" tabindex="0" role="link" aria-label="Open ${esc(b.title||'Untitled board')}">
      <div class="thumb">${b.thumb?`<img src="${b.thumb}" alt="">`:`<span>${(b.items||[]).length} items</span>`}</div>
      <div class="meta"><div><div class="t">${esc(b.title||'Untitled board')}</div><div class="d">${fmtDate(b.updated)}</div></div>
      <button class="btn ghost icon" data-move="${b.id}" title="Move to folder" aria-label="Move to folder"><svg viewBox="0 0 24 24">${FOLDER_SVG}<path d="M10 13h6m-2-2 2 2-2 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="btn ghost icon" data-del="${b.id}" title="Delete board" aria-label="Delete board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button></div>
      ${confirmId===b.id?`<div class="confirm"><button class="btn" data-cancel="1">Keep</button><button class="btn primary" style="background:var(--danger);border-color:var(--danger)" data-really="${b.id}">Delete for good</button></div>`:''}
    </div>`).join('');
  e.hidden=(subs.length+boards.length)>0;
  e.textContent = S.mode==='connecting' ? 'Loading your boards…' : curFolder ? 'This folder is empty. Paste a screenshot or press New board to add one here.' : 'No boards yet. Paste a screenshot or press New board.';
}
let foldersLoaded=false;

/* ----- folder actions ----- */
function folderPrompt(anchor, title, value, okLabel, onOk){
  const p=openPop(anchor, `<div class="row" style="flex-direction:column;align-items:stretch;gap:8px"><label for="fName">${esc(title)}</label><input class="txt" id="fName" value="${esc(value)}" maxlength="80" autocomplete="off"><div class="row" style="padding:0;justify-content:flex-end"><button class="btn" id="fCancel">Cancel</button><button class="btn primary" id="fOk">${esc(okLabel)}</button></div></div>`);
  const i=p.querySelector('#fName'); setTimeout(()=>{ i.focus(); i.select(); }, 30);
  const go=()=>{ const v=i.value.trim(); if(!v){ i.focus(); return; } closePops(); onOk(v); };
  p.querySelector('#fOk').onclick=go; p.querySelector('#fCancel').onclick=closePops;
  i.addEventListener('keydown', e=>{ if(e.key==='Enter') go(); if(e.key==='Escape') closePops(); });
}
$('#newFolderBtn').onclick=e=>folderPrompt(e.currentTarget, curFolder?'New folder inside '+(folderById(curFolder)?.name||'this folder'):'New folder', 'New folder', 'Create', async name=>{
  const id=rid(10);
  try{ await store.saveFolder(id, {name, parent:curFolder||'', created:Date.now()}); toast('Folder created'); }
  catch(err){ toast(err&&err.code==='quota_exceeded'?'Storage is full':'Could not create the folder'); }
});
function moveMenu(anchor, title, blocked, current, onPick){
  const rows=[]; const walk=(pid,depth)=>{ for(const f of folders.filter(x=>parentOf(x.id)===pid).sort(byName)){ rows.push({f,depth}); walk(f.id,depth+1); } }; walk('',1);
  const btn=(id,name,depth,dis)=>`<button class="mi ${id===current?'cur':''}" data-to="${id}" ${dis?'disabled':''} style="padding-left:${10+depth*18}px"><svg width="18" height="18" viewBox="0 0 24 24">${FOLDER_SVG}</svg>${esc(name)}${id===current?' <small style="display:inline;margin-left:4px">(here now)</small>':''}</button>`;
  const p=openPop(anchor, `<div class="note" style="padding:4px 8px 6px;font-weight:700">${esc(title)}</div><div class="tree">${btn('','All boards',0,current==='')}${rows.map(r=>btn(r.f.id,r.f.name||'Untitled folder',r.depth,blocked.has(r.f.id)||r.f.id===current)).join('')}</div>`);
  p.querySelectorAll('[data-to]').forEach(b=>b.onclick=()=>{ closePops(); onPick(b.dataset.to); });
}
async function moveBoard(id, to){
  const b=libBoards.find(x=>x.id===id); if(!b) return;
  if(boardFolder(b)===to) return;
  b.folder=to; renderLib();
  try{ await store.update(id, {folder:to}); toast(to?'Moved to '+(folderById(to)?.name||'folder'):'Moved to All boards'); }catch(_){ toast('Could not move the board'); }
}
async function moveFolder(id, to){
  const f=folderById(id); if(!f || descendants(id).has(to)) return;
  f.parent=to; renderLib();
  try{ await store.saveFolder(id, {name:f.name, parent:to, created:f.created||Date.now()}); toast('Folder moved'); }catch(_){ toast('Could not move the folder'); }
}
async function deleteFolder(id){
  const f=folderById(id); if(!f) return; const up=parentOf(id);
  try{
    for(const b of libBoards.filter(b=>boardFolder(b)===id)){ b.folder=up; await store.update(b.id, {folder:up}); }
    for(const c of folders.filter(c=>parentOf(c.id)===id)){ c.parent=up; await store.saveFolder(c.id, {name:c.name, parent:up, created:c.created||Date.now()}); }
    await store.delFolder(id); toast('Folder deleted');
  }catch(_){ toast('Could not finish deleting the folder'); }
}
$('#crumbs').addEventListener('click', e=>{ const b=e.target.closest('[data-go]'); if(b) location.hash = b.dataset.go ? '#f-'+b.dataset.go : ''; });

/* ----- drag a board card onto a folder (mouse) ----- */
let dragBoard=null;
$('#grid').addEventListener('dragstart', e=>{ const c=e.target.closest('[data-open]'); if(!c) return; dragBoard=c.dataset.open; try{ e.dataTransfer.setData('text/plain', dragBoard); e.dataTransfer.effectAllowed='move'; }catch(_){} });
$('#grid').addEventListener('dragend', ()=>{ dragBoard=null; document.querySelectorAll('.drop-on').forEach(x=>x.classList.remove('drop-on')); });
$('#grid').addEventListener('dragover', e=>{ const f=e.target.closest('[data-folder]'); if(dragBoard && f){ e.preventDefault(); e.stopPropagation(); document.querySelectorAll('.drop-on').forEach(x=>x!==f&&x.classList.remove('drop-on')); f.classList.add('drop-on'); } });
$('#grid').addEventListener('drop', e=>{ const f=e.target.closest('[data-folder]'); if(dragBoard && f){ e.preventDefault(); e.stopPropagation(); const id=dragBoard; dragBoard=null; f.classList.remove('drop-on'); moveBoard(id, f.dataset.folder); } });
$('#crumbs').addEventListener('dragover', e=>{ const b=e.target.closest('[data-go]'); if(dragBoard && b){ e.preventDefault(); e.stopPropagation(); } });
$('#crumbs').addEventListener('drop', e=>{ const b=e.target.closest('[data-go]'); if(dragBoard && b){ e.preventDefault(); e.stopPropagation(); const id=dragBoard; dragBoard=null; moveBoard(id, b.dataset.go); } });
$('#grid').addEventListener('click', async e=>{
  const del=e.target.closest('[data-del]'), really=e.target.closest('[data-really]'), cancel=e.target.closest('[data-cancel]');
  if(del){ e.stopPropagation(); confirmId=del.dataset.del; renderLib(); return; }
  if(cancel){ e.stopPropagation(); confirmId=null; renderLib(); return; }
  const mv=e.target.closest('[data-move]');
  if(mv){ e.stopPropagation(); const b=libBoards.find(x=>x.id===mv.dataset.move); moveMenu(mv, 'Move board to', new Set(), b?boardFolder(b):'', to=>moveBoard(mv.dataset.move, to)); return; }
  const fm=e.target.closest('[data-fmenu]');
  if(fm){ e.stopPropagation(); const id=fm.dataset.fmenu, f=folderById(id); if(!f) return;
    const p=openPop(fm, `<button class="mi" id="fmRen">Rename</button><button class="mi" id="fmMove">Move to…</button><button class="mi" id="fmDel" style="color:var(--danger)">Delete folder</button>`);
    p.querySelector('#fmRen').onclick=()=>folderPrompt(fm, 'Rename folder', f.name||'', 'Save', async name=>{ f.name=name; renderLib(); try{ await store.saveFolder(id, {name, parent:parentOf(id), created:f.created||Date.now()}); }catch(_){ toast('Could not rename the folder'); } });
    p.querySelector('#fmMove').onclick=()=>moveMenu(fm, 'Move folder into', descendants(id), parentOf(id), to=>moveFolder(id, to));
    p.querySelector('#fmDel').onclick=()=>{ closePops(); confirmId='f:'+id; renderLib(); };
    return; }
  const fr=e.target.closest('[data-freally]');
  if(fr){ e.stopPropagation(); confirmId=null; deleteFolder(fr.dataset.freally); return; }
  const fo=e.target.closest('[data-folder]');
  if(fo && !e.target.closest('.confirm')){ location.hash='#f-'+fo.dataset.folder; return; }
  if(really){ e.stopPropagation(); const id=really.dataset.really; confirmId=null; libBoards=libBoards.filter(b=>b.id!==id); renderLib(); try{ await store.del(id); toast('Board deleted'); }catch(_){ toast('Could not delete the board'); } return; }
  const c=e.target.closest('[data-open]'); if(c) location.hash='#b-'+c.dataset.open;
});
$('#grid').addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target.matches('.card')){ const c=e.target.closest('[data-open]'), f=e.target.closest('[data-folder]'); if(c) location.hash='#b-'+c.dataset.open; else if(f) location.hash='#f-'+f.dataset.folder; } });

/* ===== routing ===== */
function show(which){ $('#lib').hidden=which!=='lib'; $('#ed').hidden=which!=='ed'; $('#msg').hidden=which!=='msg'; }
function closeBoard(){
  if(S.dirty){ clearTimeout(saveTimer); doSave(); }
  if(unsubBoard){ unsubBoard(); unsubBoard=null; }
  S.board=null; S.id=null; S.pi=0; S.sel.clear(); S.editing=null; S.op=null; renderPages();
  for(const el of els.values()) el.remove(); els.clear();
}
function route(){
  closePops();
  if(S.mode==='connecting'){ show('lib'); renderLib(); return; }
  const m=location.hash.match(/^#b-([a-z0-9]+)$/);
  if(!m){
    const fm=location.hash.match(/^#f-([a-z0-9]+)$/); curFolder = fm ? fm[1] : ''; confirmId=null;
    closeBoard(); show('lib');
    if(!unsubFolders) unsubFolders=store.watchFolders(d=>{ folders=d; foldersLoaded=true; renderLib(); });
    if(!unsubLib) unsubLib=store.watchList(d=>{ libBoards=d; renderLib(); });
    renderLib(); return;
  }
  if(S.id===m[1]) return;
  closeBoard(); openBoard(m[1]);
}
window.addEventListener('hashchange', route);

function openBoard(id){
  S.id=id; show('ed'); setStatus('Loading…'); $('#titleIn').value='';
  let loaded=false;
  const timer=setTimeout(()=>{ if(!loaded) setStatus('Still loading…'); }, 10000);
  unsubBoard=store.watch(id, (d,meta)=>{
    if(S.id!==id) return;
    if(!loaded){
      clearTimeout(timer);
      if(!d){ if(meta && meta.fromCache) return; loaded=true; showMsg('This board does not exist','It may have been deleted. Go back to see all boards.'); return; }
      loaded=true;
      S.pi=0; S.board=normalize(JSON.parse(JSON.stringify(d))); S.lastRev=d.rev; lastThumb=0; pageThumbs.clear();
      $('#titleIn').value=S.board.title||''; resetHistory(); setStatus(db?'Saved':'Saved in this browser');
      renderPages(); fitZoom(); setTool(S.tool); thumbSoon(true);
      if(pendingBlobs){ const f=pendingBlobs; pendingBlobs=null; (async()=>{ for(const x of f) await addImageBlob(x); })(); }
      return;
    }
    if(!d || (meta && meta.hasPendingWrites)) return;
    if(d.rev && d.rev!==S.lastRev && !S.dirty && !S.op && !S.editing && !S.uploads){
      S.board=normalize(JSON.parse(JSON.stringify(d))); S.lastRev=d.rev; $('#titleIn').value=S.board.title||'';
      S.hist=S.hist.slice(0,S.hi+1); S.hist.push(snap()); S.hi=S.hist.length-1; render(); renderPages(); thumbSoon(true);
    }
  }, ()=>{ setStatus('Connection lost'); });
}
function showMsg(t,p){
  show('msg');
  $('#msg').innerHTML=`<div class="center-msg"><h2>${esc(t)}</h2><p>${esc(p)}</p><button class="btn primary" id="msgBack">All boards</button></div>`;
  $('#msgBack').onclick=()=>{ location.hash='#'; route(); };
  S.id=null;
}

/* ===== boot ===== */
buildRail(); setTool('select'); route();
(async()=>{
  if(window.claude && window.claude.use){
    try{ db=await window.claude.use('db'); }catch(e){ db=null; }
    try{ assets=await window.claude.use('assets'); }catch(e){ assets=null; }
  }
  S.mode = db ? 'cloud' : 'local';
  if(!db) $('#libStatus').textContent='Saving in this browser only';
  route();
})();
</script>

</body></html>
